name: Compilar Wio L1 Mishmesh + MediaMesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar base MediaMesh
        uses: actions/checkout@v4

      - name: Descargar interfaz Mishmesh
        run: git clone https://github.com/burakcan/MeshCore-mishmesh.git _mishmesh

      - name: Fusionar Mishmesh sobre MediaMesh
        run: |
          cp -r _mishmesh/mishmesh ./mishmesh
          cp -r _mishmesh/examples/companion_radio/ui-mishmesh ./examples/companion_radio/ui-mishmesh

          python3 - << 'EOF'
          import glob, os, re, subprocess

          def extract_braced(text, open_brace_idx):
              depth = 0
              i = open_brace_idx
              while i < len(text):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[open_brace_idx:i+1], i + 1
                  i += 1
              return text[open_brace_idx:], len(text)

          # 1. Sincronizar DisplayDriver.h (Color + supportsBrightness)
          mish_dd = next((p for p in glob.glob("_mishmesh/**/DisplayDriver.h", recursive=True)), None)
          dst_dd = next((p for p in glob.glob("src/**/DisplayDriver.h", recursive=True)), None)
          if dst_dd:
              dd_txt = open(dst_dd, errors="ignore").read()
              color_block = "  enum Color { BLACK = 0, WHITE = 1, INVERSE = 2 };"
              if mish_dd:
                  m_txt = open(mish_dd, errors="ignore").read()
                  m_col = re.search(r'enum\s+Color\b[^{]*\{', m_txt)
                  if m_col:
                      blk, end_i = extract_braced(m_txt, m_col.end() - 1)
                      color_block = "  " + m_txt[m_col.start():end_i] + ";"
              inject_dd = ""
              if "Color" not in dd_txt:
                  inject_dd += "\n" + color_block
              if "supportsBrightness" not in dd_txt:
                  inject_dd += "\n  virtual bool supportsBrightness() { return false; }"
              if inject_dd:
                  dd_txt = re.sub(
                      r'(class\s+DisplayDriver\b[^{]*\{[\s\S]*?\bpublic\s*:)',
                      r'\1' + inject_dd,
                      dd_txt,
                      count=1
                  )
                  open(dst_dd, "w").write(dd_txt)
                  print("Actualizado DisplayDriver.h:", dst_dd)

          # 2. Copiar campos faltantes de NodePrefs -> CompanionNodePrefs
          mish_np_file = next((p for p in glob.glob("_mishmesh/**/*.h", recursive=True)
                               if re.search(r'\bstruct\s+NodePrefs\b', open(p, errors="ignore").read())), None)
          dst_np_file = next((p for p in glob.glob("examples/**/*.h", recursive=True) + glob.glob("src/**/*.h", recursive=True)
                              if re.search(r'\bstruct\s+CompanionNodePrefs\b', open(p, errors="ignore").read())), None)

          if mish_np_file and dst_np_file:
              m_np = open(mish_np_file, errors="ignore").read()
              d_np = open(dst_np_file, errors="ignore").read()
              m_st = re.search(r'\bstruct\s+NodePrefs\b[^{]*\{', m_np)
              d_st = re.search(r'\bstruct\s+CompanionNodePrefs\b[^{]*\{', d_np)
              if m_st and d_st:
                  m_body, _ = extract_braced(m_np, m_st.end() - 1)
                  d_body, d_end = extract_braced(d_np, d_st.end() - 1)
                  existing_ids = set(re.findall(r'\b([A-Za-z_]\w*)\b', d_body))
                  missing_lines = []
                  for raw_line in m_body[1:-1].splitlines():
                      clean = re.sub(r'//.*', '', raw_line).strip()
                      if not clean or clean.startswith(('#', '/*', '*')):
                          continue
                      m_field = re.search(r'\b([A-Za-z_]\w*)\s*(?:\[[^\]]*\])?\s*(?:=[^;]*)?;', clean)
                      if m_field:
                          fname = m_field.group(1)
                          if fname not in existing_ids:
                              missing_lines.append("  " + clean)
                              existing_ids.add(fname)
                  if missing_lines:
                      d_np = d_np[:d_end - 1] + "\n  // Campos Mishmesh\n" + "\n".join(missing_lines) + "\n" + d_np[d_end - 1:]
                      open(dst_np_file, "w").write(d_np)
                      print(f"Agregados {len(missing_lines)} campos a CompanionNodePrefs en {dst_np_file}")

          # 3. Aplicar diff de Mishmesh en MyMesh.h y MyMesh.cpp
          first_mish = subprocess.check_output(
              ["git", "-C", "_mishmesh", "log", "--reverse", "--format=%H", "--", "mishmesh", "examples/companion_radio/ui-mishmesh"]
          ).decode().splitlines()[0].strip()
          base_commit = f"{first_mish}~1"

          for f in ["examples/companion_radio/MyMesh.h", "examples/companion_radio/MyMesh.cpp"]:
              diff_txt = subprocess.check_output(
                  ["git", "-C", "_mishmesh", "diff", "-U3", base_commit, "HEAD", "--", f]
              ).decode(errors="ignore")
              if not diff_txt.strip():
                  continue
              dst_lines = open(f, errors="ignore").read().splitlines(keepends=True)
              hunks, cur = [], []
              for line in diff_txt.splitlines(keepends=True):
                  if line.startswith("@@ "):
                      if cur: hunks.append(cur)
                      cur = []
                  elif line.startswith(("diff ", "index ", "--- ", "+++ ")):
                      continue
                  elif line.startswith((" ", "+", "-")):
                      cur.append(line)
              if cur: hunks.append(cur)

              for h in hunks:
                  old_seq = [l[1:] for l in h if l.startswith((" ", "-"))]
                  new_seq = [l[1:] for l in h if l.startswith((" ", "+"))]
                  added_only = [l[1:] for l in h if l.startswith("+")]
                  if not added_only or all(a in dst_lines for a in added_only if a.strip()):
                      continue
                  pos = next((i for i in range(len(dst_lines) - len(old_seq) + 1) if dst_lines[i:i+len(old_seq)] == old_seq), -1)
                  if pos != -1:
                      dst_lines = dst_lines[:pos] + new_seq + dst_lines[pos+len(old_seq):]
                      continue
                  before_ctx, after_ctx, seen = [], [], False
                  for l in h:
                      if l.startswith(("+", "-")):
                          seen = True; after_ctx = []
                      elif l.startswith(" "):
                          (after_ctx if seen else before_ctx).append(l[1:])
                  if before_ctx:
                      matches = [i for i in range(len(dst_lines) - len(before_ctx) + 1) if dst_lines[i:i+len(before_ctx)] == before_ctx]
                      if len(matches) == 1:
                          ins = matches[0] + len(before_ctx)
                          dst_lines = dst_lines[:ins] + added_only + dst_lines[ins:]
                          continue
                  if after_ctx:
                      matches = [i for i in range(len(dst_lines) - len(after_ctx) + 1) if dst_lines[i:i+len(after_ctx)] == after_ctx]
                      if len(matches) == 1:
                          dst_lines = dst_lines[:matches[0]] + added_only + dst_lines[matches[0]:]
              open(f, "w").writelines(dst_lines)

          # 4. Dar acceso friend class UITask a MyMesh y copiar todos los metodos ui* / mishmesh*
          mymesh_h_path = "examples/companion_radio/MyMesh.h"
          mymesh_cpp_path = "examples/companion_radio/MyMesh.cpp"
          mh = open(mymesh_h_path, errors="ignore").read()
          mc = open(mymesh_cpp_path, errors="ignore").read()
          mish_mh = open("_mishmesh/examples/companion_radio/MyMesh.h", errors="ignore").read()
          mish_mc = open("_mishmesh/examples/companion_radio/MyMesh.cpp", errors="ignore").read()

          if "CompanionNodePrefs" in mh and "typedef CompanionNodePrefs NodePrefs;" not in mh:
              mh = re.sub(r'(class\s+MyMesh\b)', r'typedef CompanionNodePrefs NodePrefs;\nclass
