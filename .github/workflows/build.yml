name: Compilar Wio L1 Mishmesh + MediaMesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar base MediaMesh
        uses: actions/checkout@v4

      - name: Descargar interfaz Mishmesh
        run: git clone https://github.com/burakcan/MeshCore-mishmesh.git _mishmesh

      - name: Fusionar Mishmesh sobre MediaMesh
        run: |
          cp -r _mishmesh/mishmesh ./mishmesh
          cp -r _mishmesh/examples/companion_radio/ui-mishmesh ./examples/companion_radio/ui-mishmesh
          python3 - << 'EOF'
          import glob, os, re, subprocess
          NL = chr(10)

          def braced(txt, idx):
              d, i = 0, idx
              while i < len(txt):
                  if txt[i] == '{': d += 1
                  elif txt[i] == '}':
                      d -= 1
                      if d == 0: return txt[idx:i+1], i + 1
                  i += 1
              return txt[idx:], len(txt)

          all_h = [p for p in glob.glob("**/*.h", recursive=True) if not p.startswith(("_mishmesh", ".pio"))]
          mish_h = glob.glob("_mishmesh/**/*.h", recursive=True)

          # 1. DisplayDriver.h: enum Color + supportsBrightness()
          color_def = "  enum Color { DARK = 0, LIGHT = 1 };"
          for mp in mish_h:
              if os.path.basename(mp) == "DisplayDriver.h":
                  mt = open(mp, errors="ignore").read()
                  mc = re.search(r'\benum\s+Color\b[^;{]*\{', mt)
                  if mc:
                      _, end_c = braced(mt, mc.end() - 1)
                      color_def = "  " + mt[mc.start():end_c] + ";"
                      break

          for d_dd in [p for p in all_h if os.path.basename(p) == "DisplayDriver.h"]:
              dt = open(d_dd, errors="ignore").read()
              add_dd = ""
              if not re.search(r'\benum\s+Color\b', dt): add_dd += NL + "public:" + NL + color_def
              if "supportsBrightness" not in dt: add_dd += NL + "public:" + NL + "  virtual bool supportsBrightness() { return false; }"
              if add_dd:
                  dt = re.sub(r'(\b(?:class|struct)\s+DisplayDriver\b[^;{]*\{)', lambda m: m.group(1) + add_dd, dt, count=1)
                  open(d_dd, "w").write(dt)

          # 2. NodePrefs.h (CompanionNodePrefs): solo variables miembro (sin metodos inline)
          m_np_f = next((p for p in mish_h if "onboarding_state" in open(p, errors="ignore").read()), None)
          d_np_f = next((p for p in all_h if re.search(r'\b(?:struct|class)\s+CompanionNodePrefs\b[^;{]*\{', open(p, errors="ignore").read())), None)
          if m_np_f and d_np_f:
              mt, dt = open(m_np_f, errors="ignore").read(), open(d_np_f, errors="ignore").read()
              ob_pos = mt.find("onboarding_state")
              mb, _ = braced(mt, mt.rfind("{", 0, ob_pos))
              ds = re.search(r'\b(?:struct|class)\s+CompanionNodePrefs\b[^;{]*\{', dt)
              db, de = braced(dt, ds.end() - 1)
              seen = set(re.findall(r'\b([A-Za-z_]\w*)\b', db))
              extra, depth = [], 0
              for ln in mb[1:-1].splitlines():
                  prev_d = depth
                  depth += ln.count('{') - ln.count('}')
                  if prev_d != 0 or depth != 0 or '{' in ln or '}' in ln or '(' in ln:
                      continue
                  c = re.sub(r'//.*', '', ln).strip()
                  if not c or c.startswith(('#', '/*', '*', 'public:', 'private:', 'protected:', 'return ')):
                      continue
                  mf = re.search(r'\b([A-Za-z_]\w*)\s*(?:\[[^\]]*\])?\s*(?::\s*\d+\s*)?(?:=[^;]*)?;', c)
                  if mf and mf.group(1) not in seen:
                      extra.append("  " + c)
                      seen.add(mf.group(1))
              if extra:
                  dt = dt[:de - 1] + NL + "public:" + NL + NL.join(extra) + NL + dt[de - 1:]
                  open(d_np_f, "w").write(dt)
                  print(f"NodePrefs.h OK ({len(extra)} campos)")

          # 3. MyMesh.h: copiar solo includes, defines, structs y miembros que NO existen en MediaMesh
          mh_p, mc_p = "examples/companion_radio/MyMesh.h", "examples/companion_radio/MyMesh.cpp"
          mh, mc = open(mh_p, errors="ignore").read(), open(mc_p, errors="ignore").read()
          mmh = open("_mishmesh/examples/companion_radio/MyMesh.h", errors="ignore").read()
          mmc = open("_mishmesh/examples/companion_radio/MyMesh.cpp", errors="ignore").read()

          top_add = []
          for inc in re.findall(r'^\s*#include\s+[<"][^">]+[>"]', mmh, flags=re.M):
              if inc.strip() not in mh: top_add.append(inc.strip())
          for df in re.finditer(r'^\s*#define\s+([A-Za-z_]\w*)\b.*', mmh, flags=re.M):
              if not re.search(rf'\b{df.group(1)}\b', mh): top_add.append(df.group(0).strip())

          m_cls_pos = mmh.find("class MyMesh")
          for st in re.finditer(r'\b(struct|enum)\s+([A-Za-z_]\w*)\b[^;{]*\{', mmh[:m_cls_pos]):
              if not re.search(rf'\b{st.group(2)}\b', mh):
                  blk, _ = braced(mmh, st.end() - 1)
                  top_add.append(f"{st.group(1)} {st.group(2)} {blk};")

          if "typedef CompanionNodePrefs NodePrefs;" not in mh:
              top_add.extend(["typedef CompanionNodePrefs NodePrefs;", "class UITask;"])
          if top_add:
              mh = re.sub(r'(\bclass\s+MyMesh\b)', lambda m: NL.join(top_add) + NL + NL + m.group(1), mh, count=1)

          m_cls = re.search(r'\bclass\s+MyMesh\b[^;{]*\{', mmh)
          m_body, _ = braced(mmh, m_cls.end() - 1)
          decls = []
          if "friend class UITask;" not in mh: decls.append("  friend class UITask;")
          if "getStore(" not in mh:
              ms2 = re.search(r'\b(\w*Store)\s*\*\s*(\w+)\s*;', mh)
              if ms2: decls.append(f"  {ms2.group(1)}* getStore() {{ return {ms2.group(2)}; }}")
          if "getNodePrefs(" not in mh:
              mp2 = re.search(r'\b(?:CompanionNodePrefs|NodePrefs)\s+(\w+)\s*;', mh)
              if mp2: decls.append(f"  NodePrefs* getNodePrefs() {{ return &{mp2.group(1)}; }}")

          depth, stmt = 0, []
          for ln in m_body[1:-1].splitlines():
              s = re.sub(r'//.*', '', ln).strip()
              if depth == 0 and (not s or s.startswith('#') or s in ('public:', 'private:', 'protected:')):
                  continue
              stmt.append(ln)
              depth += ln.count('{') - ln.count('}')
              if depth == 0 and (s.endswith(';') or s.endswith('}')):
                  full_s = NL.join(stmt)
                  stmt = []
                  head = full_s.split('{', 1)[0]
                  mf = re.search(r'\b([A-Za-z_]\w*)\s*(?:\[[^\]]*\]|\([^;{}]*\))?\s*(?:const)?\s*(?:=[^;{}]*)?;?\s*$', head)
                  if mf:
                      sym = mf.group(1)
                      if sym not in ('MyMesh', 'void', 'bool', 'int', 'uint8_t', 'uint16_t', 'uint32_t', 'const', 'static', 'virtual') and not re.search(rf'\b{sym}\b', mh):
                          decls.append(full_s)

          if decls:
              mh = re.sub(r'(\bclass\s+MyMesh\b[^;{]*\{)', lambda m: m.group(1) + NL + "public:" + NL + NL.join(decls) + NL, mh, count=1)
              print(f"MyMesh.h OK ({len(decls)} miembros agregados)")
          open(mh_p, "w").write(mh)

          # 4. MyMesh.cpp: includes, hooks internos seguros y metodos MyMesh:: faltantes
          for inc in re.findall(r'^\s*#include\s+[<"][^">]+[>"]', mmc, flags=re.M):
              if inc.strip() not in mc: mc = inc.strip() + NL + mc
          for df in re.finditer(r'^\s*#define\s+([A-Za-z_]\w*)\b.*', mmc, flags=re.M):
              if not re.search(rf'\b{df.group(1)}\b', mc): mc = df.group(0).strip() + NL + mc

          first_mish = subprocess.check_output(
              ["git", "-C", "_mishmesh", "log", "--reverse", "--format=%H", "--", "mishmesh", "examples/companion_radio/ui-mishmesh"]
          ).decode().splitlines()[0].strip()
          diff_cpp = subprocess.check_output(
              ["git", "-C", "_mishmesh", "diff", "-U3", f"{first_mish}~1", "HEAD", "--", mc_p]
          ).decode(errors="ignore")
          dst_lines = mc.splitlines(keepends=True)
          hunks, cur = [], []
          for ln in diff_cpp.splitlines(keepends=True):
              if ln.startswith("@@ "):
                  if cur: hunks.append(cur)
                  cur = []
              elif not ln.startswith(("diff ", "index ", "--- ", "+++ ")) and ln.startswith((" ", "+", "-")):
                  cur.append(ln)
          if cur: hunks.append(cur)
          for h in hunks:
              add_s = [l[1:] for l in h if l.startswith("+")]
              if not add_s or any("MyMesh::" in l for l in add_s): continue
              old_s = [l[1:] for l in h if l.startswith((" ", "-"))]
              new_s = [l[1:] for l in h if l.startswith((" ", "+"))]
              matches = [i for i in range(len(dst_lines) - len(old_s) + 1) if dst_lines[i:i+len(old_s)] == old_s]
              if len(matches) == 1:
                  cand = dst_lines[:matches[0]] + new_s + dst_lines[matches[0]+len(old_s):]
                  joined = "".join(cand)
                  if joined.count('{') == joined.count('}'):
                      dst_lines = cand
          mc = "".join(dst_lines)

          defs = []
          for m in re.finditer(r'^([^\n;{}]*\bMyMesh::([A-Za-z_]\w*)\s*\([^{;]*\)\s*(?:const)?\s*)\{', mmc, flags=re.M):
              if re.search(rf'\bMyMesh::{m.group(2)}\s*\(', mc): continue
              blk, _ = braced(mmc, m.end() - 1)
              defs.append(m.group(1) + blk)
          if defs:
              mc = mc + NL + (NL + NL).join(defs) + NL
              print(f"MyMesh.cpp OK ({len(defs)} metodos agregados)")
          open(mc_p, "w").write(mc)

          # 5. AbstractUITask.h y ui-mishmesh/UITask.h
          abs_p, ui_p = "examples/companion_radio/AbstractUITask.h", "examples/companion_radio/ui-mishmesh/UITask.h"
          at, ut = open(abs_p, errors="ignore").read(), open(ui_p, errors="ignore").read()
          mat = open("_mishmesh/examples/companion_radio/AbstractUITask.h", errors="ignore").read()
          add_abs = []
          for mv in re.findall(r'virtual\s+([^{;=]+?\([^;]*\)\s*(?:const)?)\s*(?:=\s*0\s*;|\{[^}]*\})', mat):
              vc = " ".join(mv.split())
              mn = re.search(r'\b(\w+)\s*\(', vc)
              if not mn or mn.group(1).startswith('~') or re.search(rf'\b{mn.group(1)}\s*\(', at): continue
              rt = vc[:mn.start()].strip()
              bd = "{}" if rt == "void" else ("{ return false; }" if rt == "bool" else "{ return 0; }")
              add_abs.append(f"  virtual {vc} {bd}")
          if add_abs:
              at = re.sub(r'(\bclass\s+AbstractUITask\b[^;{]*\{[\s\S]*?\bpublic\s*:)', lambda m: m.group(1) + NL + NL.join(add_abs), at, count=1)
              open(abs_p, "w").write(at)
          if "_node_prefs" not in at and "_node_prefs" not in ut:
              ut = re.sub(r'(\bclass\s+UITask\b[^;{]*\{)', lambda m: m.group(1) + NL + "protected:" + NL + "  NodePrefs* _node_prefs = nullptr;" + NL + "public:" + NL, ut, count=1)
          ut = re.sub(r'\)\s*(const\s*)?\boverride\b', lambda m: ")" + (" " + m.group(1).strip() if m.group(1) else ""), ut)
          add_ov = []
          for pv in re.findall(r'virtual\s+([^{;=]+?\([^;]*\)\s*(?:const)?)\s*=\s*0\s*;', at):
              pc = " ".join(pv.split())
              mn = re.search(r'\b(\w+)\s*\(', pc)
              if not mn or re.search(rf'\b{mn.group(1)}\s*\(', ut): continue
              rt = pc[:mn.start()].strip()
              bd = "{}" if rt == "void" else ("{ return false; }" if rt == "bool" else "{ return 0; }")
              add_ov.append(f"  {pc} {bd}")
          if add_ov:
              ut = re.sub(r'(\bclass\s+UITask\b[^;{]*\{)', lambda m: m.group(1) + NL + "public:" + NL + NL.join(add_ov) + NL, ut, count=1)
          open(ui_p, "w").write(ut)

          # 6. main.cpp y platformio.ini
          mp = "examples/companion_radio/main.cpp"
          mt2, mm2 = open(mp, errors="ignore").read(), open("_mishmesh/examples/companion_radio/main.cpp", errors="ignore").read()
          if "ui-mishmesh/UITask.h" not in mt2:
              mt2 = re.sub(r'(#include\s+"ui-[^"]+/UITask\.h")', lambda m: "#ifdef UI_MISHMESH" + NL + '#include "ui-mishmesh/UITask.h"' + NL + "#else" + NL + m.group(1) + NL + "#endif", mt2, count=1)
              mi = re.search(r'^\s*(UITask\s+ui_task\b[^;]*;)', mm2, flags=re.M)
              if mi:
                  mt2 = re.sub(r'^(\s*)(UITask\s+ui_task\b[^;]*;)', lambda m: "#ifdef UI_MISHMESH" + NL + m.group(1) + mi.group(1).strip() + NL + "#else" + NL + m.group(1) + m.group(2) + NL + "#endif", mt2, count=1, flags=re.M)
              open(mp, "w").write(mt2)

          def secs(t):
              s, o, c, b = {}, [], None, []
              for ln in t.splitlines(keepends=True):
                  m = re.match(r'^\[([^\]]+)\]\s*$', ln)
                  if m:
                      if c: s[c] = "".join(b)
                      c = m.group(1).strip(); o.append(c); b = [ln]
                  elif c: b.append(ln)
              if c: s[c] = "".join(b)
              return s, o

          si = next(p for p in glob.glob("_mishmesh/**/platformio.ini", recursive=True) if "WioTrackerL1_companion_radio_ble_mishmesh" in open(p).read())
          rel = os.path.relpath(si, "_mishmesh")
          di = rel if os.path.exists(rel) else next(p for p in glob.glob("**/platformio.ini", recursive=True) if "WioTrackerL1_companion_radio_ble" in open(p).read())
          ss, so = secs(open(si).read())
          ds2, _ = secs(open(di).read())
          add_s = [x for x in so if "mishmesh" in x.lower() and x not in ds2]
          chg = True
          while chg:
              chg = False
              for x in list(add_s):
                  for ln in ss[x].splitlines():
                      if ln.strip().startswith("extends"):
                          for p in [v.strip() for v in ln.split("=", 1)[1].split(",")]:
                              if p and p not in ds2 and p not in add_s and p in ss:
                                  add_s.insert(0, p); chg = True
          with open(di, "a") as f:
              for x in add_s:
                  f.write(NL + NL + ss[x].strip() + (NL + "  -D UI_MISHMESH=1" if x == "env:WioTrackerL1_companion_radio_ble_mishmesh" else "") + NL)
          EOF

      - name: Instalar PlatformIO
        run: pip install -U platformio

      - name: Compilar firmware para Wio Tracker L1
        env:
          FIRMWARE_VERSION: "mishmesh-mediamesh"
        run: pio run -e WioTrackerL1_companion_radio_ble_mishmesh

      - name: Generar archivo UF2
        run: |
          BUILD_DIR=".pio/build/WioTrackerL1_companion_radio_ble_mishmesh"
          if [ -f "$BUILD_DIR/firmware.uf2" ]; then
            cp "$BUILD_DIR/firmware.uf2" WioTrackerL1_mishmesh_mediamesh.uf2
          else
            UF2CONV=$(find ~/.platformio -name "uf2conv.py" | head -n 1)
            python3 "$UF2CONV" "$BUILD_DIR/firmware.hex" -c -f 0xADA52840 -o WioTrackerL1_mishmesh_mediamesh.uf2
          fi

      - name: Subir UF2 para descarga
        uses: actions/upload-artifact@v4
        with:
          name: WioTrackerL1-Mishmesh-MediaMesh
          path: WioTrackerL1_mishmesh_mediamesh.uf2
# FIN DEL ARCHIVO
