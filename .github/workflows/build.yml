name: Compilar Wio L1 Mishmesh + MediaMesh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar base MediaMesh
        uses: actions/checkout@v4

      - name: Descargar interfaz Mishmesh
        run: git clone https://github.com/burakcan/MeshCore-mishmesh.git _mishmesh

      - name: Fusionar Mishmesh sobre MediaMesh
        run: |
          cp -r _mishmesh/mishmesh ./mishmesh
          cp -r _mishmesh/examples/companion_radio/ui-mishmesh ./examples/companion_radio/ui-mishmesh

          python3 - << 'EOF'
          import glob, os, re, subprocess

          # 1. Agregar supportsBrightness() a DisplayDriver si falta
          for p in glob.glob("src/**/*DisplayDriver*.h", recursive=True):
              txt = open(p, errors="ignore").read()
              if "class DisplayDriver" in txt and "supportsBrightness" not in txt:
                  txt = re.sub(
                      r'(class\s+DisplayDriver\b[^{]*\{[\s\S]*?\bpublic\s*:)',
                      r'\1\n  virtual bool supportsBrightness() { return false; }',
                      txt,
                      count=1
                  )
                  open(p, "w").write(txt)
                  print("Agregado supportsBrightness() en:", p)

          # 2. Aplicar cambios de Mishmesh SOLO a MyMesh.h y MyMesh.cpp (no a main.cpp)
          first_mish = subprocess.check_output(
              ["git", "-C", "_mishmesh", "log", "--reverse", "--format=%H", "--", "mishmesh", "examples/companion_radio/ui-mishmesh"]
          ).decode().splitlines()[0].strip()
          base_commit = f"{first_mish}~1"

          for f in ["examples/companion_radio/MyMesh.h", "examples/companion_radio/MyMesh.cpp"]:
              diff_txt = subprocess.check_output(
                  ["git", "-C", "_mishmesh", "diff", "-U3", base_commit, "HEAD", "--", f]
              ).decode(errors="ignore")
              if not diff_txt.strip():
                  continue
              dst_lines = open(f, errors="ignore").read().splitlines(keepends=True)
              hunks, cur = [], []
              for line in diff_txt.splitlines(keepends=True):
                  if line.startswith("@@ "):
                      if cur: hunks.append(cur)
                      cur = []
                  elif line.startswith(("diff ", "index ", "--- ", "+++ ")):
                      continue
                  elif line.startswith((" ", "+", "-")):
                      cur.append(line)
              if cur: hunks.append(cur)

              for h in hunks:
                  old_seq = [l[1:] for l in h if l.startswith((" ", "-"))]
                  new_seq = [l[1:] for l in h if l.startswith((" ", "+"))]
                  added_only = [l[1:] for l in h if l.startswith("+")]
                  if not added_only or all(a in dst_lines for a in added_only if a.strip()):
                      continue
                  pos = next((i for i in range(len(dst_lines) - len(old_seq) + 1) if dst_lines[i:i+len(old_seq)] == old_seq), -1)
                  if pos != -1:
                      dst_lines = dst_lines[:pos] + new_seq + dst_lines[pos+len(old_seq):]
                      continue
                  before_ctx, after_ctx, seen = [], [], False
                  for l in h:
                      if l.startswith(("+", "-")):
                          seen = True; after_ctx = []
                      elif l.startswith(" "):
                          (after_ctx if seen else before_ctx).append(l[1:])
                  if before_ctx:
                      matches = [i for i in range(len(dst_lines) - len(before_ctx) + 1) if dst_lines[i:i+len(before_ctx)] == before_ctx]
                      if len(matches) == 1:
                          ins = matches[0] + len(before_ctx)
                          dst_lines = dst_lines[:ins] + added_only + dst_lines[ins:]
                          continue
                  if after_ctx:
                      matches = [i for i in range(len(dst_lines) - len(after_ctx) + 1) if dst_lines[i:i+len(after_ctx)] == after_ctx]
                      if len(matches) == 1:
                          dst_lines = dst_lines[:matches[0]] + added_only + dst_lines[matches[0]:]
              open(f, "w").writelines(dst_lines)

          # 3. Compatibilizar MyMesh.h (NodePrefs alias, getStore, uiRepeatFreq y acceso public)
          mymesh_h_path = "examples/companion_radio/MyMesh.h"
          mh = open(mymesh_h_path, errors="ignore").read()
          if "CompanionNodePrefs" in mh and "typedef CompanionNodePrefs NodePrefs;" not in mh:
              mh = re.sub(r'(class\s+MyMesh\b)', r'typedef CompanionNodePrefs NodePrefs;\n\n\1', mh, count=1)

          # Exponer metodos requeridos por UITask como public
          for sig in [r'mishmeshSendText\s*\(', r'mishmeshRetransmit\s*\(', r'uiRepeatFreqCount\s*\(', r'uiRepeatFreqKhz\s*\(']:
              mh = re.sub(rf'(^[ \t]*[^\n]*\b{sig})', r'public:\n\1', mh, flags=re.M)

          # Agregar getStore() si UITask lo pide y falta en MyMesh.h
          if "getStore(" not in mh:
              m_store = re.search(r'\b(\w*Store)\s*\*\s*(\w+)\s*;', mh)
              if m_store:
                  mh = re.sub(
                      r'(class\s+MyMesh\b[^{]*\{)',
                      rf'\1\npublic:\n  {m_store.group(1)}* getStore() {{ return {m_store.group(2)}; }}\n',
                      mh,
                      count=1
                  )

          # Copiar uiRepeatFreqCount / uiRepeatFreqKhz desde _mishmesh si faltan
          mish_mh = open("_mishmesh/examples/companion_radio/MyMesh.h", errors="ignore").read()
          for fn in ["uiRepeatFreqCount", "uiRepeatFreqKhz"]:
              if fn not in mh and fn in mish_mh:
                  m_fn = re.search(rf'([^\n]*\b{fn}\s*\([^)]*\)[^{{;]*\{{[\s\S]*?\n  \}})', mish_mh)
                  if m_fn:
                      mh = re.sub(r'(class\s+MyMesh\b[^{]*\{)', rf'\1\npublic:\n{m_fn.group(1)}\n', mh, count=1)

          open(mymesh_h_path, "w").write(mh)

          # 4. Adaptar ui-mishmesh/UITask.h a AbstractUITask.h de MediaMesh
          abs_ui = open("examples/companion_radio/AbstractUITask.h", errors="ignore").read()
          uitask_h_path = "examples/companion_radio/ui-mishmesh/UITask.h"
          uh = open(uitask_h_path, errors="ignore").read()

          if "_node_prefs" not in abs_ui and "_node_prefs" not in uh:
              uh = re.sub(r'(class\s+UITask\b[^{]*\{)', r'\1\nprotected:\n  NodePrefs* _node_prefs = nullptr;\npublic:\n', uh, count=1)

          # Implementar metodos virtuales puros nuevos de AbstractUITask (ej. newMsg)
          pure_virtuals = re.findall(r'virtual\s+([^{;=]+?\([^;]*\)\s*(?:const)?)\s*=\s*0\s*;', abs_ui)
          extra_overrides = []
          for pv in pure_virtuals:
              pv_clean = " ".join(pv.split())
              m_name = re.search(r'\b(\w+)\s*\(', pv_clean)
              if not m_name:
                  continue
              fn_name = m_name.group(1)
              if re.search(rf'\b{fn_name}\s*\(', uh):
                  continue
              ret_type = pv_clean[:m_name.start()].strip()
              if ret_type == "void":
                  body = "{}"
              elif ret_type == "bool":
                  body = "{ return false; }"
              else:
                  body = "{ return 0; }"
              extra_overrides.append(f"  {pv_clean} override {body}")
              print("Agregando override faltante en UITask.h:", pv_clean)

          if extra_overrides:
              uh = re.sub(
                  r'(class\s+UITask\b[^{]*\{)',
                  "\\1\npublic:\n" + "\n".join(extra_overrides) + "\n",
                  uh,
                  count=1
              )
          open(uitask_h_path, "w").write(uh)

          # 5. Conectar UITask en main.cpp de MediaMesh sin duplicar the_mesh
          main_path = "examples/companion_radio/main.cpp"
          main_txt = open(main_path, errors="ignore").read()
          mish_main = open("_mishmesh/examples/companion_radio/main.cpp", errors="ignore").read()

          if "ui-mishmesh/UITask.h" not in main_txt:
              main_txt = re.sub(
                  r'(#include\s+"ui-[^"]+/UITask\.h")',
                  r'#ifdef UI_MISHMESH\n#include "ui-mishmesh/UITask.h"\n#else\n\1\n#endif',
                  main_txt,
                  count=1
              )
              m_inst = re.search(r'^\s*(UITask\s+ui_task\b[^;]*;)', mish_main, flags=re.M)
              if m_inst:
                  mish_inst_line = m_inst.group(1).strip()
                  main_txt = re.sub(
                      r'^(\s*)(UITask\s+ui_task\b[^;]*;)',
                      rf'#ifdef UI_MISHMESH\n\1{mish_inst_line}\n#else\n\1\2\n#endif',
                      main_txt,
                      count=1,
                      flags=re.M
                  )
              open(main_path, "w").write(main_txt)
              print("main.cpp enlazado con UI_MISHMESH sin duplicar the_mesh")

          # 6. Agregar secciones de platformio.ini de Mishmesh
          def parse_sections(text):
              sections, order, cur, buf = {}, [], None, []
              for line in text.splitlines(keepends=True):
                  m = re.match(r'^\[([^\]]+)\]\s*$', line)
                  if m:
                      if cur is not None: sections[cur] = "".join(buf)
                      cur = m.group(1).strip()
                      order.append(cur)
                      buf = [line]
                  elif cur is not None:
                      buf.append(line)
              if cur is not None: sections[cur] = "".join(buf)
              return sections, order

          src_ini = next((p for p in glob.glob("_mishmesh/**/platformio.ini", recursive=True)
                          if "WioTrackerL1_companion_radio_ble_mishmesh" in open(p).read()), None)
          rel = os.path.relpath(src_ini, "_mishmesh")
          dst_ini = rel if os.path.exists(rel) else next((p for p in glob.glob("**/platformio.ini", recursive=True)
                          if "WioTrackerL1_companion_radio_ble" in open(p).read()), None)

          src_secs, src_order = parse_sections(open(src_ini).read())
          dst_secs, _ = parse_sections(open(dst_ini).read())

          to_add = [s for s in src_order if "mishmesh" in s.lower() and s not in dst_secs]
          added = True
          while added:
              added = False
              for s in list(to_add):
                  for line in src_secs[s].splitlines():
                      if line.strip().startswith("extends"):
                          for p in [x.strip() for x in line.split("=", 1)[1].split(",")]:
                              if p and p not in dst_secs and p not in to_add and p in src_secs:
                                  to_add.insert(0, p)
                                  added = True

          with open(dst_ini, "a") as f:
              for s in to_add:
                  if s == "env:WioTrackerL1_companion_radio_ble_mishmesh" and "-D UI_MISHMESH" not in src_secs[s]:
                      f.write("\n\n" + src_secs[s].strip() + "\n  -D UI_MISHMESH=1\n")
                  else:
                      f.write("\n\n" + src_secs[s].strip() + "\n")
          EOF

      - name: Instalar PlatformIO
        run: pip install -U platformio

      - name: Compilar firmware para Wio Tracker L1
        env:
          FIRMWARE_VERSION: "mishmesh-mediamesh"
        run: pio run -e WioTrackerL1_companion_radio_ble_mishmesh

      - name: Generar archivo UF2
        run: |
          BUILD_DIR=".pio/build/WioTrackerL1_companion_radio_ble_mishmesh"
          if [ -f "$BUILD_DIR/firmware.uf2" ]; then
            cp "$BUILD_DIR/firmware.uf2" WioTrackerL1_mishmesh_mediamesh.uf2
          else
            UF2CONV=$(find ~/.platformio -name "uf2conv.py" | head -n 1)
            python3 "$UF2CONV" "$BUILD_DIR/firmware.hex" -c -f 0xADA52840 -o WioTrackerL1_mishmesh_mediamesh.uf2
          fi

      - name: Subir UF2 para descarga
        uses: actions/upload-artifact@v4
        with:
          name: WioTrackerL1-Mishmesh-MediaMesh
          path: WioTrackerL1_mishmesh_mediamesh.uf2
